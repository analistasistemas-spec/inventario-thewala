<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Usuario')}">
    <meta charset="UTF-8">
    <title>Nuevo usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragmentos :: menu}"></div>
<div class="container mt-4">
    <h1 class="titulo-pagina" th:text="${formularioUsuario.id} == null ? '➕ Nuevo usuario' : '✏️ Editar usuario'">Usuario</h1>
    <div class="caja-formulario">
        <form th:action="@{/usuarios}" th:object="${formularioUsuario}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" th:field="*{usuario}">
            </div>
            <div class="mb-3">
                <label class="form-label">Clave</label>
                <div class="form-text">Al editar, deja este campo vacío para conservar la clave actual.</div>
                <input type="password" class="form-control" th:field="*{clave}">
            </div>
            <div class="mb-3">
                <label class="form-label">Rol</label>
                <select class="form-select" th:field="*{rol}">
                    <option value="CONSULTA">CONSULTA (solo ver)</option>
                    <option value="ADMIN">ADMIN (todo)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">💾 Guardar</button>
            <a class="btn btn-secondary" th:href="@{/usuarios}">Cancelar</a>
        </form>
    </div>
</div>
<div th:replace="~{fragmentos :: pie}"></div>
</body>
</html>
