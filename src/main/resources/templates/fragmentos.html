<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
    Piezas reutilizables de la aplicacion.
    Esta pagina nunca se muestra sola: es un almacen de fragmentos.
-->

<head th:fragment="cabeza(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Inventario The Wala'">Inventario The Wala</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<nav th:fragment="menu" class="navbar navbar-expand navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🏥 Inventario The Wala</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Inicio</a>
            <a class="nav-link" th:href="@{/equipos}">Equipos</a>
            <a class="nav-link" th:href="@{/equipos/nuevo}">Registrar</a>
            <a sec:authorize="hasRole('ADMIN')" class="nav-link" th:href="@{/usuarios}">Usuarios</a>
        </div>
        <span class="navbar-text text-white ms-auto me-3">👤 <span sec:authentication="name"></span></span>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light btn-sm" type="submit">Salir</button>
        </form>
    </div>
</nav>

<footer th:fragment="pie" class="pie">
    IPS The Wala &middot; Inventario de equipos de computo
</footer>

</body>
</html>
