<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Equipos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">🏥 Inventario de equipos — IPS The Wala</h1>
    <table class="table table-striped table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Placa</th><th>Marca</th><th>Modelo</th><th>Sede</th><th>Responsable</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipo : ${equipos}">
            <td><a th:href="@{/equipos/{id}(id=${equipo.id})}" th:text="${equipo.placa}"></a></td>
            <td th:text="${equipo.marca}"></td>
            <td th:text="${equipo.modelo}"></td>
            <td th:text="${equipo.sede}"></td>
            <td th:text="${equipo.responsable}"></td>
            <td>
                <a class="btn btn-warning btn-sm" th:href="@{/equipos/{id}/editar(id=${equipo.id})}">✏️ Editar</a>
                <form th:action="@{/equipos/{id}/eliminar(id=${equipo.id})}" method="post" style="display:inline">
                    <button class="btn btn-danger btn-sm" type="submit">🗑️ Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <a class="btn btn-primary" th:href="@{/equipos/nuevo}">➕ Registrar nuevo equipo</a>
</div>
</body>
</html>
