<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Equipos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragmentos :: menu}"></div>
<div class="container mt-4">
    <h1 class="mb-4">🏥 Inventario de equipos — IPS The Wala</h1>
    <form class="row g-2 mb-3" method="get" th:action="@{/equipos}">
        <div class="col-auto">
            <input type="text" class="form-control" name="texto" th:value="${texto}" placeholder="Buscar por placa, marca, modelo, sede o responsable...">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">🔍 Buscar</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-secondary" th:href="@{/equipos}">Limpiar</a>
        </div>
    </form>
    <table class="table table-striped table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Placa</th><th>Marca</th><th>Modelo</th><th>Sede</th><th>Responsable</th>
            <th>Tipo</th><th>Estado</th><th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipo : ${equipos}">
            <td><a th:href="@{/equipos/{id}(id=${equipo.id})}" th:text="${equipo.placa}"></a></td>
            <td th:text="${equipo.marca}"></td>
            <td th:text="${equipo.modelo}"></td>
            <td th:text="${equipo.sede}"></td>
            <td th:text="${equipo.responsable}"></td>
            <td th:text="${equipo.tipo}"></td>
            <td th:text="${equipo.estado}"></td>
            <td>
                <a sec:authorize="hasRole('ADMIN')" class="btn btn-warning btn-sm" th:href="@{/equipos/{id}/editar(id=${equipo.id})}">✏️ Editar</a>
                <form sec:authorize="hasRole('ADMIN')" th:action="@{/equipos/{id}/eliminar(id=${equipo.id})}" method="post" style="display:inline">
                    <button class="btn btn-danger btn-sm" type="submit">🗑️ Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary" th:href="@{/equipos/nuevo}">➕ Registrar nuevo equipo</a>
    <a class="btn btn-success" th:href="@{/equipos/excel(texto=${texto})}">📊 Exportar a Excel</a>
    <a class="btn btn-danger" th:href="@{/equipos/pdf(texto=${texto})}">📄 Exportar a PDF</a>
</div>
</body>
</html>
