<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo equipo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragmentos :: menu}"></div>
<div class="container mt-4">
    <h1 class="mb-4">📝 Registrar equipo</h1>
    <div style="max-width: 500px">
        <form th:action="@{/equipos}" th:object="${equipo}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <div class="text-danger" th:errors="*{placa}"></div>
                <label class="form-label">Placa</label>
                <input type="text" class="form-control" th:field="*{placa}">
            </div>
            <div class="mb-3">
                <div class="text-danger" th:errors="*{marca}"></div>
                <label class="form-label">Marca</label>
                <input type="text" class="form-control" th:field="*{marca}">
            </div>
            <div class="mb-3">
                <div class="text-danger" th:errors="*{modelo}"></div>
                <label class="form-label">Modelo</label>
                <input type="text" class="form-control" th:field="*{modelo}">
            </div>
            <div class="mb-3">
                <div class="text-danger" th:errors="*{sede}"></div>
                <label class="form-label">Sede</label>
                <select class="form-select" th:field="*{sede}">
                    <option value="">-- Seleccione --</option>
                    <option value="Ibagué">Ibagué</option>
                    <option value="Chaparral">Chaparral</option>
                    <option value="Ortega">Ortega</option>
                    <option value="Natagaima">Natagaima</option>
                    <option value="San Antonio">San Antonio</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Responsable</label>
                <input type="text" class="form-control" th:field="*{responsable}">
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo</label>
                <input type="text" class="form-control" th:field="*{tipo}" placeholder="ESCRITORIO, PORTATIL, TODO_EN_UNO, IMPRESORA">
            </div>
            <div class="mb-3">
                <label class="form-label">Procesador</label>
                <input type="text" class="form-control" th:field="*{procesador}" placeholder="Intel Core i5-10400, Ryzen 5 5600G...">
            </div>
            <div class="mb-3">
                <label class="form-label">RAM (GB)</label>
                <input type="number" class="form-control" th:field="*{ramGb}">
            </div>
            <div class="mb-3">
                <label class="form-label">Disco (GB)</label>
                <input type="number" class="form-control" th:field="*{discoGb}">
            </div>
            <div class="mb-3">
                <label class="form-label">Estado</label>
                <input type="text" class="form-control" th:field="*{estado}" placeholder="ACTIVO, MANTENIMIENTO, DADO_DE_BAJA">
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha de compra</label>
                <input type="date" class="form-control" th:field="*{fechaCompra}">
            </div>
            <button type="submit" class="btn btn-success">💾 Guardar</button>
            <a class="btn btn-secondary" th:href="@{/equipos}">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
