<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo equipo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">📝 Registrar equipo</h1>
    <div style="max-width: 500px">
        <form th:action="@{/equipos}" th:object="${equipo}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label">Placa</label>
                <input type="text" class="form-control" th:field="*{placa}">
            </div>
            <div class="mb-3">
                <label class="form-label">Marca</label>
                <input type="text" class="form-control" th:field="*{marca}">
            </div>
            <div class="mb-3">
                <label class="form-label">Modelo</label>
                <input type="text" class="form-control" th:field="*{modelo}">
            </div>
            <div class="mb-3">
                <label class="form-label">Sede</label>
                <input type="text" class="form-control" th:field="*{sede}">
            </div>
            <div class="mb-3">
                <label class="form-label">Responsable</label>
                <input type="text" class="form-control" th:field="*{responsable}">
            </div>
            <button type="submit" class="btn btn-success">💾 Guardar</button>
            <a class="btn btn-secondary" th:href="@{/equipos}">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
