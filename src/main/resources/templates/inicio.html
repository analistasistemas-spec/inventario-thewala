<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario IPS The Wala</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">🏥 Inventario IPS The Wala</h1>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card text-white bg-success mb-3">
                <div class="card-body text-center">
                    <h2 class="card-title" th:text="${totalEquipos}">0</h2>
                    <p class="card-text">Equipos registrados</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card text-white bg-secondary mb-3">
                <div class="card-body text-center">
                    <h2 class="card-title" th:text="${totalPerifericos}">0</h2>
                    <p class="card-text">Periféricos registrados</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4">
            <h5>Por sede</h5>
            <table class="table table-sm table-bordered">
                <tr th:each="fila : ${porSede}">
                    <td th:text="${fila[0]} ?: 'Sin definir'"></td>
                    <td class="text-end fw-bold" th:text="${fila[1]}"></td>
                </tr>
            </table>
        </div>
        <div class="col-md-4">
            <h5>Por estado</h5>
            <table class="table table-sm table-bordered">
                <tr th:each="fila : ${porEstado}">
                    <td th:text="${fila[0]} ?: 'Sin definir'"></td>
                    <td class="text-end fw-bold" th:text="${fila[1]}"></td>
                </tr>
            </table>
        </div>
        <div class="col-md-4">
            <h5>Por tipo</h5>
            <table class="table table-sm table-bordered">
                <tr th:each="fila : ${porTipo}">
                    <td th:text="${fila[0]} ?: 'Sin definir'"></td>
                    <td class="text-end fw-bold" th:text="${fila[1]}"></td>
                </tr>
            </table>
        </div>
    </div>

    <a class="btn btn-primary btn-lg mt-3" th:href="@{/equipos}">📋 Ver inventario completo</a>
</div>
</body>
</html>
