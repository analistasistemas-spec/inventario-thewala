<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Usuarios')}">
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragmentos :: menu}"></div>
<div class="container mt-4">
    <h1 class="titulo-pagina">👥 Usuarios del sistema</h1>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <table class="table table-striped table-bordered table-hover">
        <thead class="table-dark">
        <tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.usuario}"></td>
            <td th:text="${usuario.rol}"></td>
            <td>
                <span th:if="${usuario.activo}" class="badge bg-success">Activo</span>
                <span th:unless="${usuario.activo}" class="badge bg-secondary">Inactivo</span>
            </td>
            <td>
                <form th:action="@{/usuarios/{id}/estado(id=${usuario.id})}" method="post" style="display:inline">
                    <a class="btn btn-info btn-sm" th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">✏️ Editar</a>
                    <button class="btn btn-warning btn-sm" type="submit">Activar / Desactivar</button>
                </form>
                <form th:action="@{/usuarios/{id}/eliminar(id=${usuario.id})}" method="post" style="display:inline">
                    <button class="btn btn-danger btn-sm" type="submit">🗑️ Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">➕ Nuevo usuario</a>
</div>
<div th:replace="~{fragmentos :: pie}"></div>
</body>
</html>
