<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle equipo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragmentos :: menu}"></div>
<div class="container mt-4">
    <h1 class="mb-2" th:text="'💻 Equipo ' + ${equipo.placa}">placa</h1>
    <p class="text-secondary">
        <span th:text="${equipo.marca}"></span> —
        <span th:text="${equipo.modelo}"></span> |
        Sede: <span th:text="${equipo.sede}"></span> |
        Responsable: <span th:text="${equipo.responsable}"></span>
        <br>
        Tipo: <span th:text="${equipo.tipo}"></span> |
        Procesador: <span th:text="${equipo.procesador}"></span> |
        RAM: <span th:text="${equipo.ramGb}"></span> GB |
        Disco: <span th:text="${equipo.discoGb}"></span> GB |
        Estado: <span th:text="${equipo.estado}"></span> |
        Comprado: <span th:text="${equipo.fechaCompra}"></span>
    </p>

    <h2 class="mt-4">Periféricos</h2>
    <table class="table table-striped table-bordered table-hover">
        <thead class="table-dark">
        <tr><th>Tipo</th><th>Marca</th><th>Serial</th><th style="width:80px"></th></tr>
        </thead>
        <tbody>
        <tr th:each="periferico : ${perifericos}">
            <td th:text="${periferico.tipo}"></td>
            <td th:text="${periferico.marca}"></td>
            <td th:text="${periferico.serial}"></td>

            <td>
                <form th:action="@{/perifericos/{id}/eliminar(id=${periferico.id})}" method="post">
                    <button class="btn btn-danger btn-sm" type="submit">🗑️</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h3 class="mt-4">Agregar periférico</h3>
    <div style="max-width: 500px">
        <form th:action="@{/equipos/{id}/perifericos(id=${equipo.id})}" th:object="${nuevoPeriferico}" method="post">
            <div class="mb-3">
                <label class="form-label">Tipo</label>
                <input type="text" class="form-control" th:field="*{tipo}" placeholder="Mouse, Teclado, Monitor...">
            </div>
            <div class="mb-3">
                <label class="form-label">Marca</label>
                <input type="text" class="form-control" th:field="*{marca}">
            </div>
            <div class="mb-3">
                <label class="form-label">Serial</label>
                <input type="text" class="form-control" th:field="*{serial}">
            </div>
            <button type="submit" class="btn btn-success">💾 Guardar</button>
        </form>
    </div>

    <p class="mt-4"><a class="btn btn-secondary" th:href="@{/equipos}">← Volver al listado</a></p>
</div>
</body>
</html>
