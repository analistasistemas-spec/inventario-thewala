# Nombre de la aplicacion
spring.application.name=inventario-thewala

# Puerto donde escucha el servidor (9090: el 8080 y el 8090 ya estan ocupados en esta maquina)
server.port=9090

# --- Base de datos (la activaremos en el Paso 3 de la guia) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/inventario_thewala
# spring.datasource.username=postgres
# spring.datasource.password=TU_CLAVE
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5433/inventario_thewala
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# --- Seguridad: usuario unico del inventario ---
# La clave sale de la variable de entorno INVENTARIO_PASSWORD; si no existe, usa la de
# desarrollo. En un servidor real se define la variable y la clave nunca vive en el codigo.
spring.security.user.name=${INVENTARIO_USER:admin}
spring.security.user.password=${INVENTARIO_PASSWORD:12345}